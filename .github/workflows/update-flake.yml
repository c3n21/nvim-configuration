name: Update flake inputs

on:
  workflow_dispatch:
  schedule:
    # Daily at 02:17 UTC
    - cron: "17 2 * * *"

concurrency:
  group: update-flake-inputs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  ATTIC_ENDPOINT: https://attic.services.home.arpa
  ATTIC_CACHE: default

jobs:
  update-flake:
    name: Update flake inputs and build packages
    runs-on: homelab-nix
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            max-jobs = 2
            cores = 1
            ssl-cert-file = /runner-ca/ca-certificates.crt

      - name: Update all flake inputs
        run: nix flake update

      - name: Check whether lockfile changed
        id: changes
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Attic
        if: steps.changes.outputs.changed == 'true'
        uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
        with:
          endpoint: ${{ env.ATTIC_ENDPOINT }}
          cache: ${{ env.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}
          inputs-from: .
          skip-push: true

      - name: Verify Attic availability
        if: steps.changes.outputs.changed == 'true'
        run: attic cache info "$ATTIC_CACHE" >/dev/null

      - name: Record initial Nix store paths
        if: steps.changes.outputs.changed == 'true'
        run: >-
          nix path-info --all --json --json-format 2
          > "$RUNNER_TEMP/nix-store-before.json"

      - name: Build all exposed packages
        id: build
        if: steps.changes.outputs.changed == 'true'
        run: |
          if ! package_lines="$(
            nix eval --json .#packages.x86_64-linux --apply builtins.attrNames \
              | jq -r '.[] | ".#" + .'
          )"; then
            echo "Failed to evaluate packages.x86_64-linux"
            exit 1
          fi
          mapfile -t packages < <(printf '%s' "$package_lines")

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No packages exposed for x86_64-linux"
            exit 1
          fi

          if ! output_lines="$(
            nix build --no-link --print-out-paths "${packages[@]}"
          )"; then
            echo "Failed to build packages.x86_64-linux"
            exit 1
          fi
          mapfile -t outputs < <(printf '%s' "$output_lines")

          if [ "${#outputs[@]}" -eq 0 ]; then
            echo "Build returned no output paths"
            exit 1
          fi

          printf '%s\n' "${outputs[@]}" > "$RUNNER_TEMP/nix-output-paths"
          printf 'published-output=%s\n' "${outputs[@]}"

      - name: Publish newly realized paths after failed build
        if: failure() && steps.changes.outputs.changed == 'true' && steps.build.outcome == 'failure'
        continue-on-error: true
        run: |
          nix path-info --all --json --json-format 2 \
            > "$RUNNER_TEMP/nix-store-after.json"
          jq -r --slurpfile before "$RUNNER_TEMP/nix-store-before.json" '
            .storeDir as $storeDir
            | ((.info | keys) - ($before[0].info | keys))[]
            | "\($storeDir)/\(.)"
          ' "$RUNNER_TEMP/nix-store-after.json" \
            > "$RUNNER_TEMP/nix-new-paths"

          if [ -s "$RUNNER_TEMP/nix-new-paths" ]; then
            attic push "$ATTIC_CACHE" --stdin \
              < "$RUNNER_TEMP/nix-new-paths"
          else
            echo "No new Nix store paths to publish"
          fi

      - name: Install GitHub CLI
        if: steps.changes.outputs.changed == 'true'
        run: nix profile add --inputs-from . nixpkgs#gh

      - name: Create or update draft pull request
        id: pull_request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/update-flake-inputs
          BASE_BRANCH: develop
          PR_TITLE: "chore: update flake inputs"
          PR_BODY: |
            Automated flake input update.

            All packages exposed under `packages.x86_64-linux` built successfully. Publication of the locally built paths to the homelab Attic cache is pending; upstream-cached dependencies remain available from their source caches.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH_NAME"
          git add flake.lock
          git commit -m "$PR_TITLE"

          remote_oid=""
          if remote_line=$(git ls-remote --exit-code --heads origin "refs/heads/$BRANCH_NAME"); then
            read -r remote_oid _ <<< "$remote_line"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
          fi
          git push \
            --force-with-lease="refs/heads/$BRANCH_NAME:$remote_oid" \
            origin "HEAD:refs/heads/$BRANCH_NAME"

          pr_number=$(gh pr list \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$PR_TITLE" --body "$PR_BODY"
            is_draft=$(gh pr view "$pr_number" --json isDraft --jq '.isDraft')
            if [ "$is_draft" != "true" ]; then
              gh pr ready "$pr_number" --undo
            fi
          else
            pr_url=$(gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --draft)
            pr_number=${pr_url##*/}
          fi

          case "$pr_number" in
            ''|*[!0-9]*)
              echo "Unable to determine pull request number: $pr_number" >&2
              exit 1
              ;;
          esac
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Publish all package closures to Attic
        id: publish
        if: steps.changes.outputs.changed == 'true'
        run: >-
          attic push "$ATTIC_CACHE" --stdin
          < "$RUNNER_TEMP/nix-output-paths"

      - name: Record cache publication failure on pull request
        if: failure() && steps.pull_request.outcome == 'success' && steps.publish.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull_request.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failure_body=$(cat <<EOF
          Automated flake input update.

          All packages exposed under \`packages.x86_64-linux\` built successfully, but publication to the homelab Attic cache failed. See the [workflow run]($RUN_URL). This PR remains draft pending successful cache publication.
          EOF
          )
          gh pr edit "$PR_NUMBER" --body "$failure_body"
          is_draft=$(gh pr view "$PR_NUMBER" --json isDraft --jq '.isDraft')
          if [ "$is_draft" != "true" ]; then
            gh pr ready "$PR_NUMBER" --undo
          fi

      - name: Finalize pull request
        if: steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull_request.outputs.number }}
          PR_BODY: |
            Automated flake input update.

            All packages exposed under `packages.x86_64-linux` built successfully. Locally built paths were published to the homelab Attic cache, while upstream-cached dependencies remain available from their source caches.
        run: |
          gh pr edit "$PR_NUMBER" --body "$PR_BODY"
          is_draft=$(gh pr view "$PR_NUMBER" --json isDraft --jq '.isDraft')
          if [ "$is_draft" = "true" ]; then
            gh pr ready "$PR_NUMBER"
          fi
