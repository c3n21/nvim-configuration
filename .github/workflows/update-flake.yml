name: Update flake inputs

on:
  workflow_dispatch:
  schedule:
    # Daily at 02:17 UTC
    - cron: "17 2 * * *"

concurrency:
  group: update-flake-inputs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  ATTIC_ENDPOINT: https://attic.services.home.arpa
  ATTIC_CACHE: default

jobs:
  update-flake:
    name: Update flake inputs and build packages
    runs-on: homelab-nix
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            max-jobs = 2
            cores = 1
            ssl-cert-file = /runner-ca/ca-certificates.crt

      - name: Update all flake inputs
        run: nix flake update

      - name: Check whether lockfile changed
        id: changes
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Attic
        if: steps.changes.outputs.changed == 'true'
        uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
        with:
          endpoint: ${{ env.ATTIC_ENDPOINT }}
          cache: ${{ env.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}
          inputs-from: .

      - name: Verify Attic availability
        if: steps.changes.outputs.changed == 'true'
        run: attic cache info "$ATTIC_CACHE" >/dev/null

      - name: Build all exposed packages
        if: steps.changes.outputs.changed == 'true'
        run: |
          if ! package_lines="$(
            nix eval --json .#packages.x86_64-linux --apply builtins.attrNames \
              | jq -r '.[] | ".#" + .'
          )"; then
            echo "Failed to evaluate packages.x86_64-linux"
            exit 1
          fi
          mapfile -t packages < <(printf '%s' "$package_lines")

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No packages exposed for x86_64-linux"
            exit 1
          fi

          if ! output_lines="$(
            nix build --no-link --print-out-paths "${packages[@]}"
          )"; then
            echo "Failed to build packages.x86_64-linux"
            exit 1
          fi
          mapfile -t outputs < <(printf '%s' "$output_lines")

          if [ "${#outputs[@]}" -eq 0 ]; then
            echo "Build returned no output paths"
            exit 1
          fi

          printf '%s\n' "${outputs[@]}" > "$RUNNER_TEMP/nix-output-paths"
          printf 'published-output=%s\n' "${outputs[@]}"

      - name: Publish all package closures to Attic
        if: steps.changes.outputs.changed == 'true'
        run: >-
          attic push "$ATTIC_CACHE" --stdin
          < "$RUNNER_TEMP/nix-output-paths"

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/update-flake-inputs
          BASE_BRANCH: develop
          PR_TITLE: "chore: update flake inputs"
          PR_BODY: |
            Automated flake input update.

            This PR was opened only after successfully building every package exposed under `packages.x86_64-linux`; locally built paths were published to the homelab Attic cache, while upstream-cached dependencies remain available from their source caches.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH_NAME"
          git add flake.lock
          git commit -m "$PR_TITLE"

          remote_oid=""
          if remote_line=$(git ls-remote --exit-code --heads origin "refs/heads/$BRANCH_NAME"); then
            read -r remote_oid _ <<< "$remote_line"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
          fi
          git push \
            --force-with-lease="refs/heads/$BRANCH_NAME:$remote_oid" \
            origin "HEAD:refs/heads/$BRANCH_NAME"

          pr_number=$(gh pr list \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi
