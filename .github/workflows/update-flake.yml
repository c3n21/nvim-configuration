name: Update flake inputs
on:
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC
    - cron: "17 6 * * *"
    # Testing, to be removed
    - cron: "*/30 * * * *"
permissions:
  contents: write
  pull-requests: write
jobs:
  update-flake:
    name: Update flake inputs and build packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Update all flake inputs
        run: nix flake update
      - name: Check whether lockfile changed
        id: changes
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build all exposed packages
        if: steps.changes.outputs.changed == 'true'
        run: |
          mapfile -t packages < <(
            nix eval --json .#packages.x86_64-linux --apply builtins.attrNames \
              | jq -r '.[] | ".#" + .'
          )

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No packages exposed for x86_64-linux"
            exit 1
          fi

          nix build --no-link "${packages[@]}"
      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/update-flake-inputs
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PR_TITLE: "chore: update flake inputs"
          PR_BODY: |
            Automated flake input update.

            This PR was opened only after successfully building every package exposed under `packages.x86_64-linux`.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH_NAME"
          git add flake.lock
          git commit -m "$PR_TITLE"
          git push --force-with-lease origin "$BRANCH_NAME"

          pr_number=$(gh pr list \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi
